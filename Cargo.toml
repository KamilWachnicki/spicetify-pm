[package]
name = "spicepm"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "A Spicetify Marketplace package manager for themes, extensions and snippets"
license = "MIT"
repository = "https://github.com/kamil/spicepm"
keywords = ["spicetify", "spotify", "marketplace", "cli"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
console = "0.16"
dialoguer = "0.12"
futures = "0.3"
indicatif = "0.18"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "gzip",
    "json",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-ini = "0.21"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
insta = "1"
tempfile = "3"
wiremock = "0.6"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
lto = true
strip = true
codegen-units = 1
